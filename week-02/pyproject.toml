[project]
name = "stock-analyst"
version = "0.1.0"
description = "BAI Probie Week 2 Assignment - Stock Market Analyst with Pydantic AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.10.1",
    "yfinance>=0.2.50",
    "rich>=14.2.0",
    "pydantic-ai-slim[openai]>=1.8.0",
    "ruff>=0.14.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
]
